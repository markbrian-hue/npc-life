name: Game regression checks

on:
  push:
    branches:
      - 'feat/npc-career-and-city-bulletin'
      - 'feat/living-city-survival-weather'
  pull_request:
    branches:
      - main
      - 'feat/npc-career-and-city-bulletin'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
