name: Vertical traversal browser smoke
on:
  push:
    branches:
      - 'feat/nyc-vertical-traversal'
      - 'feat/nyc-districts-streetscape'
      - 'feat/nyc-expanded-megacity'
  workflow_dispatch:
jobs:
  traverse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright-core@1.56.1
      - name: Verify browser and run real traversal
        run: |
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$BROWSER"
          NPC_LIFE_PLAYWRIGHT_MODULE=playwright-core NPC_LIFE_CHROMIUM="$BROWSER" node tests/vertical-traversal-browser.mjs
